services:
  postgres:
    image: postgres:16
    container_name: odontoconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odontoconnect}
      POSTGRES_USER: ${POSTGRES_USER:-odontoconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "5432:5432"
    volumes:
      - odontoconnect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odontoconnect} -d ${POSTGRES_DB:-odontoconnect}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  odontoconnect_pgdata:
